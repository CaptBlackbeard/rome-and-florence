<style>

  html{height:100%;background:#FAF3E7;background:var(--page,#FAF3E7)}

  .legend{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:.5rem 1.1rem;align-items:center;
          padding:.65rem 16px calc(.65rem + env(safe-area-inset-bottom,0px));
          border-top:1px solid var(--rule);background:var(--surface);font-size:.92rem}
  .key{display:inline-flex;align-items:center;gap:.4rem;cursor:pointer;user-select:none}

  .dot{width:13px;height:13px;border-radius:50%;border:2px solid #FFFDF8;
       box-shadow:0 0 0 1px rgba(0,0,0,.25);display:inline-block}
  .hint{color:var(--ink-soft);font-style:italic;font-size:.88rem}
  .pin{border-radius:50%;border:2px solid #FFFDF8;box-shadow:0 1px 4px rgba(0,0,0,.45)}

  .dot.sq{border-radius:3px}
  .dot.ring{box-shadow:0 0 0 1px rgba(0,0,0,.25), inset 0 0 0 3px rgba(255,253,248,.92)}

  .leaflet-popup-tip{background:var(--surface)}
  .leaflet-popup-content{margin:.7rem .85rem;font-family:var(--body);font-size:.95rem;line-height:1.45}
  .pop-n{font-family:var(--display);font-size:1.2rem;font-weight:600;color:var(--wine);display:block}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pop-n{color:#F3D9B8}}

  .pop-d{display:block;margin-top:.25rem}
  .pop-w{display:block;margin-top:.4rem;padding-top:.4rem;border-top:1px solid var(--rule);
         color:var(--olive);font-weight:500}
  .walkbtn{margin-top:.5rem;font-family:var(--display);font-size:.95rem;cursor:pointer;
    background:var(--wine);color:#FCF4E6;border:1px solid var(--gold);border-radius:999px;padding:.25rem .7rem}
  .panel{position:absolute;right:10px;top:10px;z-index:1000;max-width:230px;background:var(--surface);

         box-shadow:0 4px 14px rgba(0,0,0,.2)}

  .panel .close{float:right;cursor:pointer;color:var(--ink-soft);border:0;background:none;font-size:1rem}
  @media (max-width:560px){
    header h1{font-size:1.2rem;width:100%}
    .legend{font-size:.85rem;gap:.4rem .8rem}
    .panel{max-width:180px;font-size:.84rem}
  }
</style>

}, {"n": "Piazza del Popolo", "c": "option", "city": "Rome", "lat": 41.910748, "lng": 12.476365, "a": "", "d": "Huge open square, twin churches, steps up to the Pincio view.", "u": "", "t": ""}, {"n": "Capitoline Museums", "c": "option", "city": "Rome", "lat": 41.892666, "lng": 12.482201, "a": "", "d": "The oldest public museum in the world. Indoors when it rains.", "u": "", "t": ""}, {"n": "Galleria Borghese", "c": "option", "city": "Rome", "lat": 41.914113, "lng": 12.492105, "a": "", "d": "Bernini and Caravaggio. Timed entry, book well ahead.", "u": "", "t": ""}, {"n": "Bioparco di Roma", "c": "option", "city": "Rome", "lat": 41.917599, "lng": 12.486773, "a": "", "d": "The zoo inside Villa Borghese. The easiest win with a toddler.", "u": "", "t": ""}, {"n": "Giardino degli Aranci", "c": "option", "city": "Rome", "lat": 41.884926, "lng": 12.480451, "a": "", "d": "Orange garden on the Aventine with a terrace over the whole city.", "u": "", "t": ""}, {"n": "Circus Maximus", "c": "option", "city": "Rome", "lat": 41.886158, "lng": 12.485309, "a": "", "d": "A vast open field to let a small child simply run.", "u": "", "t": ""}, {"n": "Janiculum Terrace", "c": "option", "city": "Rome", "lat": 41.891575, "lng": 12.461164, "a": "", "d": "The best view in Rome, a puppet theatre, and a cannon at noon.", "u": "", "t": ""}, {"n": "Villa Doria Pamphilj", "c": "option", "city": "Rome", "lat": 41.884328, "lng": 12.44776, "a": "", "d": "Rome's largest park. Lakes, pines, pushchair-friendly paths.", "u": "", "t": ""}, {"n": "Baths of Caracalla", "c": "option", "city": "Rome", "lat": 41.878828, "lng": 12.492474, "a": "", "d": "Enormous ruins with space around them and few crowds.", "u": "", "t": ""}, {"n": "Bocca della Verita", "c": "option", "city": "Rome", "lat": 41.888229, "lng": 12.481599, "a": "", "d": "The mouth of truth. Five minutes, and worth the photo.", "u": "", "t": ""}, {"n": "Uffizi Gallery", "c": "option", "city": "Florence", "lat": 43.768313, "lng": 11.255801, "a": "", "d": "Botticelli and the rest. Book a timed slot on uffizi.it.", "u": "", "t": ""}, {"n": "Galleria dell'Accademia", "c": "option", "city": "Florence", "lat": 43.776917, "lng": 11.258758, "a": "", "d": "Michelangelo's David. Small, quick, book ahead.", "u": "", "t": ""}, {"n": "Palazzo Vecchio", "c": "option", "city": "Florence", "lat": 43.769143, "lng": 11.25614, "a": "", "d": "The town hall, the tower climb, and the square outside is free.", "u": "", "t": ""}, {"n": "Bardini Gardens", "c": "option", "city": "Florence", "lat": 43.764212, "lng": 11.257128, "a": "", "d": "Bundled with the Boboli ticket. Wisteria tunnel and a city view.", "u": "", "t": ""}, {"n": "Mercato Centrale", "c": "option", "city": "Florence", "lat": 43.776585, "lng": 11.253209, "a": "", "d": "Food hall upstairs, produce market down. Easy lunch, any weather.", "u": "", "t": ""}, {"n": "Basilica di Santa Croce", "c": "option", "city": "Florence", "lat": 43.768365, "lng": 11.26302, "a": "", "d": "Michelangelo and Galileo are buried here. Big square in front.", "u": "", "t": ""}, {"n": "San Miniato al Monte", "c": "option", "city": "Florence", "lat": 43.759432, "lng": 11.265143, "a": "", "d": "Above Piazzale Michelangelo. Monks sing vespers most afternoons.", "u": "", "t": ""}, {"n": "Giardino dell'Orticoltura", "c": "option", "city": "Florence", "lat": 43.787232, "lng": 11.260999, "a": "", "d": "A glasshouse, a garden, and a playground. Locals, not tourists.", "u": "", "t": ""}, {"n": "Parco delle Cascine", "c": "option", "city": "Florence", "lat": 43.782931, "lng": 11.215493, "a": "", "d": "The big riverside park, with playgrounds and room to run.", "u": "", "t": ""}, {"n": "Museo Galileo", "c": "option", "city": "Florence", "lat": 43.767664, "lng": 11.255906, "a": "", "d": "Telescopes and globes, right by the Uffizi. Rarely crowded.", "u": "", "t": ""}, {"n": "Palazzo Pitti", "c": "option", "city": "Florence", "lat": 43.765281, "lng": 11.250257, "a": "", "d": "The palace the Boboli Gardens b tating single origins from its own Aliena roastery, served as espresso, V60 and batch brew.", "u": "https://www.farorome.com/", "t": "https://www.tripadvisor.com/Restaurant_Review-g187791-d12048731-Reviews-Faro_Caffe-Rome_Lazio.html"}, {"n": "Pergamino Caffè", "c": "coffee", "city": "Rome", "lat": 41.906081, "lng": 12.457762, "a": "Piazza del Risorgimento 7", "d": "Vatican-adjacent specialty bar pouring AeroPress, siphon, nitro and pour-over from small Italian roasters like Gardelli and Rinaldi.", "u": "https://www.instagram.com/pergaminocaffe/", "t": "https://www.tripadvisor.com/Restaurant_Review-g187791-d10532166-Reviews-Pergamino_Caffe-Rome_Lazio.html"}, {"n": "Sciascia Caffè 1919", "c": "coffee", "city": "Rome", "lat": 41.909797, "lng": 12.461983, "a": "Via Fabio Massimo 80/A", "d": "Prati institution since 1919: its caffè al cioccolato arrives in a cup lined with melted dark chocolate.", "u": "https://www.sciasciacaffe1919.it/", "t": "https://www.tripadvisor.com/Restaurant_Review-g187791-d3716672-Reviews-Sciascia_Caffe-Rome_Lazio.html"}, {"n": "Ditta Artigianale (Via dei Neri)", "c": "coffee", "city": "Florence", "lat": 43.768091, "lng": 11.258552, "a": "Via dei Neri 32r", "d": "Francesco Sanapo's roastery that started Italian specialty coffee; flat whites, V60 and single origins beside proper espresso.", "u": "https://dittaartigianale.com/en", "t": "https://www.tripadvisor.com/Restaurant_Review-g187895-d6600195-Reviews-Ditta_Artigianale-Florence_Tuscany.html"}, {"n": "Caffè Gilli", "c": "coffee", "city": "Florence", "lat": 43.771945, "lng": 11.254283, "a": "Via Roma 1r", "d": "Florence's oldest café, 1733, with Art Nouveau rooms; order espresso and pastry standing at the marble counter.", "u": "https://www.caffegilli.com/en", "t": "https://www.tripadvisor.com/Restaurant_Review-g187895-d696487-Reviews-Caffe_Gilli-Florence_Tuscany.html"}, {"n": "Procacci 1885", "c": "coffee", "city": "Florence", "lat": 43.771781, "lng": 11.251423, "a": "Via de' Tornabuoni 64r", "d": "Open since 1885 on Via Tornabuoni; truffle-butter panini with an espresso or a glass of Antinori.", "u": "https://procacci1885.it/en/florence-wine-and-truffles/", "t": "https://www.tripadvisor.com/Restaurant_Review-g187895-d1074802-Reviews-Procacci_1885-Florence_Tuscany.html"}, {"n": "Caffetteria Piansa", "c": "coffee", "city": "Florence", "lat": 43.770173, "lng": 11.275409, "a": "Via Vincenzo Gioberti 51r", "d": "Staderini family roasts its own beans since 1976; dialled-in espresso plus V60 and cold brew, rare locally.", "u": "https://www.caffepiansa.com/", "t": "https://www.tripadvisor.com/Restaurant_Review-g187895-d12675856-Reviews-Caffetteria_Piansa-Florence_Tuscany.html"}, {"n": "Caffè degli Artigiani", "c": "coffee", "city": "Florence", "lat": 43.76722, "lng": 11.250591, "a": "Via dello Sprone 16r", "d": "Neighbourhood bar on Piazza della Passera since 1945, where Oltrarno regulars take espresso and homemade cakes standing.", "u": "https://www.instagram.com/caffedegliartigianifirenze/", "t": "https://www.tripadvisor.com/Restaurant_Review-g187895-d696485-Reviews-Caffe_degli_Artigiani-Florence_Tuscany.html"}];
</script>
<script>
(function(){
  var COL={hotel:"#5A2A27",sight:"#6B7A4F",eat:"#C1502E",wine:"#7A4E7E",gelato:"#C9A24B",coffee:"#6F4E37",option:"#4A6E8A"};
  var LABEL={hotel:"Hotel",sight:"Sight",eat:"Restaurant",wine:"Wine bar",gelato:"Gelato",coffee:"Coffee bar",option:"If plans change"};
  var WALK=80; // metres per minute, an unhurried city pace
  var map=L.map("map",{zoomControl:true,scrollWheelZoom:true}).setView([41.8955,12.4823],14);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{
    maxZoom:19,
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);

  function metres(a,b){
    var R=6371000, t=Math.PI/180;
    var dLa=(b.lat-a.lat)*t, dLo=(b.lng-a.lng)*t;
    var s=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dLo/2)*Math.sin(dLo/2);
    return 2*R*Math.asin(Math.sqrt(s));
  }
  var markers=[], circles=L.layerGroup().addTo(map), current=null;

  function popupHTML(p, from){
    var title = p.u ? '<a href="'+p.u+'" target="_blank" rel="noopener">'+p.n+'</a>' : p.n;
    var h='<span class="pop-n">'+title+'</span><span class="pop-a">'+LABEL[p.c]+(p.a?" &middot; "+p.a:"")+'</span>';
    if(p.d) h+='<span class="pop-d">'+p.d+'</span>';
    if(p.t) h+='<span class="pop-d"><a href="'+p.t+'" target="_blank" rel="noopener">reviews on Tripadvisor</a></span>';
    if(from && from!==p){
      var m=metres(from,p);
      h+='<span class="pop-w">'+Math.round(m)+' m from '+from.n+' &mdash; about '+Math.max(1,Math.round(m/WALK))+' min on foot</span>';
    }
    if(p.c==="hotel") h+='<button class="walkbtn" type="button" data-walk="'+p.n+'">walking circles from here</button>';
    return h;
  }
  function redrawPopups(){
    markers.forEach(function(m){ m.setPopupContent(popupHTML(m.place, current)); });
  }
  function showPanel(p){
    hidePanel();
    var near={5:0,10:0,15:0}, closest=null, closestMin=1e9;
    PLACES.forEach(function(q){
      if(q===p || q.c==="hotel" || q.c==="option" || q.city!==p.city) return;
      var mins=metres(p,q)/WALK;
      if(mins<closestMin){ closestMin=mins; closest=q; }
      if(mins<=5) near[5]++; if(mins<=10) near[10]++; if(mins<=15) near[15]++;
    });
    var d=L.DomUtil.create("div","panel"); d.id="walkpanel";
    d.innerHTML='<button class="close" type="button" aria-label="Close">&times;</button>'+
      '<b>'+p.n+'</b><br>Within a walk of:<br>'+
      '&bull; 5 min &mdash; '+near[5]+' places<br>'+
      '&bull; 10 min &mdash; '+near[10]+' places<br>'+
      '&bull; 15 min &mdash; '+near[15]+' places<br>'+
      (closest ? '<span class="pop-a">nearest: '+closest.n+', about '+Math.max(1,Math.round(closestMin))+' min</span><br>' : '')+
      '<span class="hint">Circles are straight-line; streets add a little.</span>';
    document.getElementById("map").appendChild(d);
    L.DomEvent.disableClickPropagation(d);
    d.querySelector(".close").addEventListener("click",function(){hidePanel();circles.clearLayers();current=null;redrawPopups();});
  }
  function hidePanel(){ var e=document.getElementById("walkpanel"); if(e) e.remove(); }
  function drawWalk(p){
    circles.clearLayers(); current=p;
    [[5,.30],[10,.20],[15,.12]].forEach(function(pair){
      L.circle([p.lat,p.lng],{radius:pair[0]*WALK,color:"#6B7A4F",weight:1,
        fillColor:"#6B7A4F",fillOpacity:pair[1],interactive:false}).addTo(circles);
    });
    showPanel(p); redrawPopups();
    map.fitBounds(L.latLng(p.lat,p.lng).toBounds(15*WALK*2.4),{padding:[20,20]});
  }
  PLACES.forEach(function(p){
    var size=p.c==="hotel"?19:13;
    var icon=L.divIcon({className:"",iconSize:[size,size],iconAnchor:[size/2,size/2],
      html:'<div class="pin '+p.c+'" style="width:'+size+'px;height:'+size+'px;background:'+COL[p.c]+'"></div>'});
    var m=L.marker([p.lat,p.lng],{icon:icon,title:p.n,riseOnHover:true}).addTo(map);
    m.place=p; m.bindPopup(popupHTML(p,null),{maxWidth:260});
    m.on("popupopen",function(e){
      var b=e.popup.getElement().querySelector("[data-walk]");
      if(b) b.addEventListener("click",function(){ drawWalk(p); });
    });
    markers.push(m);
  });
  function bounds(city){
    var pts=markers.filter(function(m){return m.place.city===city;}).map(function(m){return m.getLatLng();});
    return L.latLngBounds(pts);
  }
  function go(city){
    circles.clearLayers(); hidePanel(); current=null; redrawPopups();
    map.flyToBounds(bounds(city),{padding:[30,30],duration:.8});
    document.querySelectorAll(".cities button").forEach(function(b){
      b.setAttribute("aria-pressed", String(b.dataset.city===city));
    });
  }
  document.querySelectorAll(".cities button").forEach(function(b){
    b.addEventListener("click",function(){ go(b.dataset.city); });
  });
  document.querySelectorAll(".legend input").forEach(function(cb){
    cb.addEventListener("change",function(){
      markers.forEach(function(m){
        if(m.place.c!==cb.dataset.cat) return;
        if(cb.checked) m.addTo(map); else map.removeLayer(m);
      });
    });
  });
  map.fitBounds(bounds("Rome"),{padding:[30,30]});
})();
</script>
